name: Release

# Tag a version to publish installers:
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            # Newline-delimited: the upload action treats a space-separated string
            # as a single glob, which silently matches nothing and uploads no assets.
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            target: --win
            artifacts: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build installer
        # Built unsigned: no Developer ID / code-signing certificate in CI. Users get
        # a Gatekeeper / SmartScreen prompt on first launch; the README explains it.
        # Uploading is left to the step below rather than electron-builder's own
        # publisher, which needs provider config this repo deliberately doesn't carry.
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          draft: false
          generate_release_notes: true
